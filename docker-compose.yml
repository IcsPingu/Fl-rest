

# Template base para todos os clientes (evita repetição)
x-client-template: &client-template
  image: fl-framework
  volumes:
    - ./data:/app/data
    - ./fl_logs:/app/fl_logs
    - ./client:/app/client
    - ./shared:/app/shared
    - ./config.py:/app/config.py
  # AQUI ESTA A CORRECAO: Lista simples, sem condicao de saude
  depends_on: 
    - server

services:
  # Controlador de Rede (Latência/Banda)
  docker-tc:
    image: lukaszlach/docker-tc
    container_name: docker-tc
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/docker-tc:/var/docker-tc
    restart: always

  # Servidor Central
  server:
    build: .
    image: fl-framework
    container_name: fl-rest_server_1
    command: >
      sh -c "tensorboard --logdir=/app/fl_logs/tensorboard --port=6006 --host=0.0.0.0 &
             python -m server.app"
    ports:
      - "5000:5000"
      - "6006:6006"
    volumes:
      - ./data:/app/data
      - ./fl_logs:/app/fl_logs
      - ./server:/app/server
      - ./shared:/app/shared
      - ./config.py:/app/config.py
    # Removemos o Healthcheck para evitar que o Docker mate o servidor por lentidao
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  client_001:
    <<: *client-template
    container_name: fl-rest_client_001_1
    command: python -m client.app
    environment:
      - CLIENT_ID=client_001
      - SERVER_URL=http://server:5000
      - TRAIN_FRACTION=1.0 
    labels:
      - "com.docker-tc.enabled=1"
      - "com.docker-tc.limit=1gbit"
      - "com.docker-tc.delay=20ms"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

